services:
  # --------------------------------------------------------------------------
  # 1. Backend REST API (NestJS Fastify) - Single Service Initial Deployment
  # --------------------------------------------------------------------------
  - type: web
    name: simply-ecommerce-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @simply/db generate && pnpm turbo run build --filter=@simply/api...
    startCommand: pnpm --filter @simply/db migrate && node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      # External PostgreSQL Connection String (e.g. Neon, Supabase, AWS RDS).
      # Set this value in the Render dashboard or when prompted during Blueprint creation.
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: OTP_DEV_MOCK_ENABLED
        value: "false"
      # Provide mailbox credentials securely in the deployment environment.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: MEDIA_STORAGE_DRIVER
        value: local
      - key: MEDIA_PUBLIC_URL_PREFIX
        value: https://simply-ecommerce-api.onrender.com/media/file
